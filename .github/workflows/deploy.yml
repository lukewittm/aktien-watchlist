name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 19:00 UTC, Mo–Fr = 20:00/21:00 MEZ/MESZ – bewusster Kompromiss, kein Vollständigkeits-
    # Optimum: Asien/Europa/Indien sind zu diesem Zeitpunkt sicher geschlossen, USA (~20:00
    # UTC Sommer- / 21:00 UTC Winterzeit) und Brasilien (~20:30 UTC) aber noch NICHT – deren
    # "Diff. 1T" zeigt bei diesem Zeitpunkt meist "–" statt einer echten Tagesbewegung (siehe
    # dailyDiff() in App.tsx), weil die gemeinsame Datums-Achse nicht gehandelte Regionen
    # künstlich mit dem Vortageskurs auffüllt. Für vollständige Abdeckung inkl. USA/Brasilien
    # müsste der Cron auf 21:00–23:00 UTC verschoben werden (dafür später am Tag fertig).
    - cron: '0 19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Holt frische Kurse für den Build. Läuft nur in diesem Job – wird NIE committet,
      # dadurch wächst das Repo nicht (kein Daten-Branch, keine täglichen Commits nötig).
      - run: npm run fetch
      # Qualitäts-Gate: bricht ab, wenn der Fetch zwar durchlief, aber sichtbar
      # degradierte Daten lieferte (z.B. Yahoo-Ausfall). Bei Abbruch deployt der
      # Workflow nicht neu – die zuletzt erfolgreiche Version bleibt live.
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
